<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Reservation - Migano Restaurant</title>
    <link rel="icon" href="rev.webp">
    <link rel="stylesheet" href="reserv.css">
</head>
<body>
    <header>
        <h1>Make a Reservation at <span>Migano Restaurant</span></h1>
        <p>We look forward to serving you a memorable meal!</p>
    </header>

    <div class="navbar">
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="reservations.html">Reservations</a>
        <a href="contactt.html">Contact Us</a>
    </div>

    <section class="reservation-form">
        <h2>Reserve Your Table</h2>
        <form onsubmit="handleReservationForm(event)" class="contact-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="date">Reservation Date:</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label for="time">Reservation Time:</label>
                <select id="time" name="time" required>
                    <option value="12:00">12:00 PM</option>
                    <option value="13:00">1:00 PM</option>
                    <option value="14:00">2:00 PM</option>
                    <option value="17:00">5:00 PM</option>
                    <option value="18:00">6:00 PM</option>
                    <option value="19:00">7:00 PM</option>
                    <option value="20:00">8:00 PM</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="special_requests">Special Requests (optional):</label>
                <textarea id="special_requests" name="special_requests" rows="4"></textarea>
            </div>

            <div class="form-group">
                <input type="submit" value="Reserve Table">
            </div>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Migano Restaurant. All Rights Reserved.</p>
        <p>Address: 123 Flavor Street, Cityville | Phone: (123) 456-7890 | <a href="mailto:info@miganorestaurant.com" style="color: white;">Email Us</a></p>
    </footer>

    <script>
        async function handleReservationForm(event) {
            event.preventDefault();
            const form = event.target;

            // Collect form data
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const phone = form.phone.value.trim();
            const date = form.date.value.trim();
            const time = form.time.value.trim();
            const specialRequests = form.special_requests.value.trim();

            if (!name || !email || !phone || !date || !time) {
                alert("All required fields must be filled out.");
                return;
            }

            try {
                // Send data to the server
                const response = await fetch("https://formspree.io/f/mpwqavlb", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        name, 
                        email, 
                        phone, 
                        date, 
                        time, 
                        special_requests: specialRequests
                    }),
                });

                if (response.ok) {
                    alert("Reservation submitted successfully!");
                    form.reset();
                } else {
                    const error = await response.text();
                    alert(`Failed to submit reservation: ${error}`);
                }
            } catch (error) {
                console.error("Error submitting reservation:", error);
                alert("An error occurred while submitting the reservation. Please try again later.");
            }
        }
    </script>
</body>
</html>
