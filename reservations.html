<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Reservation - Migano Restaurant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #2d3e50;
            color: white;
            text-align: center;
            padding: 2em 0;
        }

        header h1 {
            margin: 0;
            font-size: 3em;
        }

        .navbar {
            text-align: center;
            background-color: #ff6f61;
            padding: 1em 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 1.5em;
            font-size: 1.2em;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .reservation-form {
            background-color: white;
            margin: 3em auto;
            padding: 2em;
            width: 60%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .reservation-form h2 {
            text-align: center;
            color: #2d3e50;
            font-size: 2.5em;
        }

        .form-group {
            margin-bottom: 1.5em;
        }

        label {
            display: block;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 0.5em;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.8em;
            font-size: 1em;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-top: 0.3em;
        }

        input[type="submit"] {
            background-color: #ff6f61;
            color: white;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #e55d4b;
        }

        footer {
            background-color: #2d3e50;
            color: white;
            text-align: center;
            padding: 1.5em 0;
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Make a Reservation at <span>Migano Restaurant</span></h1>
        <p>We look forward to serving you a memorable meal!</p>
    </header>

    <div class="navbar">
        <a href="home.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="reservations.html">Reservations</a>
        <a href="contactt.html">Contact Us</a>
    </div>

    <section class="reservation-form">
        <h2>Reserve Your Table</h2>
        <form>
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            
            <div class="form-group">
                <label for="date">Reservation Date:</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="form-group">
                <label for="time">Reservation Time:</label>
                <select id="time" name="time" required>
                    <option value="12:00">12:00 PM</option>
                    <option value="13:00">1:00 PM</option>
                    <option value="14:00">2:00 PM</option>
                    <option value="17:00">5:00 PM</option>
                    <option value="18:00">6:00 PM</option>
                    <option value="19:00">7:00 PM</option>
                    <option value="20:00">8:00 PM</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="special_requests">Special Requests (optional):</label>
                <textarea id="special_requests" name="special_requests" rows="4"></textarea>
            </div>

            <div class="form-group">
                <input type="submit" value="Reserve Table">
            </div>
        </form>
    </section>

    <footer>
        <p>&copy; 2025 Migano Restaurant. All Rights Reserved.</p>
        <p>Address: 123 Flavor Street, Cityville | Phone: (123) 456-7890 | <a href="mailto:info@miganorestaurant.com" style="color: white;">Email Us</a></p>
    </footer>
    <script>
            async function handleContactForm(event) {
            event.preventDefault();
            const form = event.target;

            // Collect form data
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const message = form.message.value.trim();

            if (!name || !email || !message) {
                alert("All fields are required.");
                return;
            }

            try {
                // Send data to the server
                const response = await fetch("https://formspree.io/f/mpwqavlb", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ name, email, message }),
                });

                if (response.ok) {
                    alert("Message sent successfully!");
                    form.reset();
                } else {
                    const error = await response.text();
                    alert(`Failed to send message: ${error}`);
                }
            } catch (error) {
                console.error("Error sending message:", error);
                alert("An error occurred while sending the message. Please try again later.");
            }
        }
    </script>
</body>
</html>
