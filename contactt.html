<!DOCTYPE html>
<html lang="en">
<head>
    <title>Website Design</title>
    <script>
        async function handleContactForm(event) {
            event.preventDefault();
            const form = event.target;

            // Collect form data
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const message = form.message.value.trim();

            if (!name || !email || !message) {
                alert("All fields are required.");
                return;
            }

            try {
                // Send data to the server
                const response = await fetch("https://formspree.io/f/mpwqavlb", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ name, email, message }),
                });

                if (response.ok) {
                    alert("Message sent successfully!");
                    form.reset();
                } else {
                    const error = await response.text();
                    alert(`Failed to send message: ${error}`);
                }
            } catch (error) {
                console.error("Error sending message:", error);
                alert("An error occurred while sending the message. Please try again later.");
            }
        }
    </script>
    <link rel="stylesheet" href="contact.css">
    <link rel="icon"  href="codlogo.avif">
</head>
<body>
<div class="wrapper">
    <header>
        <h3>Contact <span> Migano Restaurant</span></h3>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="reservations.html">Reservertion</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <section class="contact">
            <h2>Contact Us</h2>
            <form onsubmit="handleContactForm(event)" class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required />
            
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required />
            
                <label for="message">Message:</label>
                <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
            
                <button type="submit" class="btn">Send</button>
            </form>
        </section>
    </main>
</div>
</body>
</html>
